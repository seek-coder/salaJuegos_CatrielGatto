
<nav class="fixed top-0 left-0 right-0 z-50"
     style="background: rgba(26,27,38,0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(122,162,247,0.15);">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

    <a routerLink="/home"
       class="font-mono text-lg font-bold tracking-widest transition-all duration-300 hover:scale-105"
       style="color: #7aa2f7; text-shadow: 0 0 15px rgba(122,162,247,0.5) ">
      🕹️ El Cyber de Cato
    </a>

    <div class="hidden md:flex items-center gap-8">
      <a routerLink="/home" routerLinkActive="active-link"
         class="nav-link font-mono text-sm tracking-widest transition-colors duration-300 uppercase hover:scale-105"
         style="color: #565f89" onmouseenter="this.style.color='#7aa2f7'" onmouseleave="if(!this.classList.contains('active-link'))this.style.color='#565f89'">
        Home
      </a>
      <a routerLink="/quien-soy" routerLinkActive="active-link"
         class="nav-link font-mono text-sm tracking-widest transition-colors duration-300 uppercase hover:scale-105"
         style="color: #565f89" onmouseenter="this.style.color='#7aa2f7'" onmouseleave="if(!this.classList.contains('active-link'))this.style.color='#565f89'">
        Quién Soy
      </a>
      <a routerLink="/registro"
         class="btn-neon text-sm">
        Registrarse
      </a>
      <a routerLink="/login"
         class="btn-green text-sm">
        Ingresar
      </a>
    </div>

    <button class="md:hidden focus:outline-none"
            style="color: #7aa2f7"
            (click)="menuOpen = !menuOpen"
            id="hamburger-btn"
            aria-label="Toggle menu">
      <svg *ngIf="!menuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg *ngIf="menuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div *ngIf="menuOpen"
       class="md:hidden px-6 py-4 flex flex-col gap-4"
       style="background: rgba(26,27,38,0.98); border-top: 1px solid rgba(122,162,247,0.1)">
    <a routerLink="/home" routerLinkActive="active-link"
       (click)="menuOpen = false"
       class="font-mono text-sm tracking-widest transition-colors uppercase" style="color: #565f89">Home</a>
    <a routerLink="/quien-soy" routerLinkActive="active-link"
       (click)="menuOpen = false"
       class="font-mono text-sm tracking-widest transition-colors uppercase" style="color: #565f89">Quién Soy</a>
    <a routerLink="/registro" (click)="menuOpen = false" class="btn-neon text-center text-sm">Registrarse</a>
    <a routerLink="/login" (click)="menuOpen = false" class="btn-green text-center text-sm">Ingresar</a>
  </div>
</nav>

<main class="pt-20 min-h-screen">
  <router-outlet></router-outlet>
</main>

<footer class="py-6 text-center"
        style="background: rgba(26,27,38,0.9); border-top: 1px solid rgba(122,162,247,0.1)">
  <p class="font-mono text-xs tracking-widest" style="color: #565f89">
    🕹️ El Cyber de Cato &nbsp;|&nbsp; UTN — Programación IV &nbsp;|&nbsp; Sprint 1
  </p>
</footer>
